name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --force --ignore-scripts

      - name: Setup EAS CLI
        run: npm install -g --unsafe-perm=true eas-cli

      - name: Ensure EAS Config Exists
        run: |
          if [ ! -f eas.json ]; then
            echo '{"cli":{"version":">= 5.0.0"},"build":{"preview":{"developmentClient":false,"distribution":"internal","android":{"buildType":"apk"}},"production":{}}}' > eas.json
          fi
        shell: bash

      - name: Build APK with EAS
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
