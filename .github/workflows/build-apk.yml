name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --force --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Force Exact Configs & Generate Keystore
        run: |
          cat << 'EOF' > app.json
          {
            "expo": {
              "name": "إدارة ديوني",
              "slug": "manage-debt",
              "android": {
                "package": "com.mhm421.managedebt"
              },
              "extra": {
                "eas": {
                  "projectId": "5c29accf-1f88-4c3b-953e-fdaad87b4d7d"
                }
              }
            }
          }
          EOF
          cat << 'EOF' > eas.json
          {
            "cli": {
              "appVersionSource": "remote"
            },
            "build": {
              "preview": {
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EOF
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore -alias debt-key -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=ManageDebt, OU=Mobile, O=App, L=City, S=State, C=PS"

      - name: Build APK with EAS
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 5c29accf-1f88-4c3b-953e-fdaad87b4d7d
          EAS_NO_VCS: 1
          EAS_BUILD_PROFILE: preview
          EAS_ANDROID_KEYSTORE_PATH: release.keystore
          EAS_ANDROID_KEYSTORE_PASSWORD: password123
          EAS_ANDROID_KEY_ALIAS: debt-key
          EAS_ANDROID_KEY_PASSWORD: password123
