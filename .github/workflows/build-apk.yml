name: Build Android APK Offline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate App & Install Expo
        run: |
          echo "=== البحث عن مجلد التطبيق ==="
          APP_DIR=$(dirname $(find . -maxdepth 3 -name "app.json" -o -name "App.tsx" -o -name "App.js" | head -n 1))
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "تم العثور على المسار: $APP_DIR"
          cd $APP_DIR
          npm install expo --force

      - name: Prebuild Native Android Project
        run: |
          cd ${{ env.APP_DIR }}
          npx --yes expo prebuild --platform android --clean

      - name: Build APK via Gradle
        run: |
          cd ${{ env.APP_DIR }}/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manage-Debts-App
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
