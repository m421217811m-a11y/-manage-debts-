name: Build Android APK Offline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies with pnpm
        working-directory: artifacts/manage-debts
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Native Android Project
        working-directory: artifacts/manage-debts
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Debug Signing for Release
        working-directory: artifacts/manage-debts/android/app
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle

      - name: Build Standalone APK via Gradle
        working-directory: artifacts/manage-debts/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manage-Debts-App
          path: artifacts/manage-debts/android/app/build/outputs/apk/release/*.apk
